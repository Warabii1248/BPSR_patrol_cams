<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出現ログ - BPSR Patrol Cams</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg0:#0d1117;--bg1:#161b22;--bg2:#1c2128;--bg3:#262d3a;--accent:#58a6ff;--warn:#d29922;--text1:#e6edf3;--text2:#8b949e;--text3:#6e7781;--border:#30363d;--radius:8px;}
/* 本体GUIのテーマ(localStorage uiTheme)に追従。色値は styles.css と同一 */
[data-theme="black"]{--bg0:#000;--bg1:#0c0c0c;--bg2:#181818;--bg3:#242424;--accent:#00e5ff;--warn:#ffca28;--text1:#fff;--text2:#ccc;--text3:#888;--border:#3e3e3e}
[data-theme="light"]{--bg0:#f6f8fa;--bg1:#fff;--bg2:#f0f2f5;--bg3:#e1e4e8;--accent:#0969da;--warn:#7a4500;--text1:#1f2328;--text2:#57606a;--text3:#6e7781;--border:#d0d7de}
[data-theme="warm"]{--bg0:#000;--bg1:#0d0b00;--bg2:#1a1600;--bg3:#262000;--accent:#ffd700;--warn:#ffa000;--text1:#fff;--text2:#d4bc6a;--text3:#8a7538;--border:#644e00}
body{background:var(--bg0);color:var(--text1);font-family:'Segoe UI',sans-serif;font-size:13px;display:flex;flex-direction:column;height:100vh}
h1{font-size:13px;padding:0 16px;height:44px;background:var(--bg1);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;flex-shrink:0;font-weight:500}
#container{flex:1;overflow-y:auto;padding:8px}
table{width:100%;border-collapse:collapse;font-size:0.85em}
th{color:var(--warn);text-align:left;padding:4px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg1);z-index:1;font-weight:500}
td{padding:4px 10px;border-bottom:1px solid var(--border);line-height:1.4;white-space:nowrap}
tr:hover td{background:var(--bg2)}
.ch{color:var(--accent);font-family:monospace;font-weight:bold}
.time{color:var(--text3);margin-right:6px}
.monster{color:var(--warn);font-weight:bold}
.monster.silver{color:var(--text2)}
.no-data{color:var(--text3);padding:12px}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--bg3);border-radius:3px}
</style>
</head>
<body>
<h1>🌟 出現ログ</h1>
<div id="container"><div class="no-data">読み込み中...</div></div>
<script>
// 本体GUIのテーマに追従（同一オリジンの localStorage を共有・storage イベントでライブ更新）
(function(){
  function applyTheme(){document.body.setAttribute('data-theme',localStorage.getItem('uiTheme')||'dark-blue');}
  applyTheme();
  window.addEventListener('storage',e=>{if(e.key==='uiTheme')applyTheme();});
})();
function eH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
async function load(){
  const h=await fetch('/api/gold-history').then(r=>r.json()).catch(()=>[]);
  const c=document.getElementById('container');
  if(!h||h.length===0){c.innerHTML='<div class="no-data">出現履歴なし</div>';return;}
  c.innerHTML='<table><thead><tr><th>時刻</th><th>名前</th><th>Ch</th><th>場所</th></tr></thead><tbody>'
    +h.map(e=>{const nm=e.monster_name||'金ウリボ';const cls=nm.includes('銀ナッポ')?'monster silver':'monster';return '<tr><td class="time">'+eH(e.time||'')+'</td><td class="'+cls+'">'+eH(nm)+'</td><td class="ch">Ch'+Number(e.channel)+'</td><td>'+eH(e.location||'')+'</td></tr>'}).join('')
    +'</tbody></table>';
}
load();
// SSE(下記)が検知イベントを即時反映するため、ポーリングは削除反映用の保険として30s（本体と整合）
setInterval(load,30000);
const es=new EventSource('/events');
es.onmessage=e=>{if(e.data.includes('[DETECTION]')||e.data.includes('[GUI] 金ウリボ'))load();};
</script>
</body>
</html>
